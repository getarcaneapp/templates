x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/speedtest-tracker.svg
  urls:
    - https://docs.linuxserver.io/images/docker-speedtest-tracker/

services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8085}:80"
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/speedtest-tracker.svg
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      APP_KEY: ${APP_KEY:?Generate a base64 application key}
      APP_URL: ${APP_URL:-http://localhost:8085}
      DB_CONNECTION: sqlite
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong administrator password}
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_SCHEDULE:-0 */6 * * *}
    volumes:
      - config:/config

volumes:
  config:
