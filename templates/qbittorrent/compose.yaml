x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/qbittorrent.svg
  urls:
    - https://docs.linuxserver.io/images/docker-qbittorrent/

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/tcp"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WEBUI_PORT: ${APP_PORT:-8080}
      TORRENTING_PORT: ${TORRENT_PORT:-6881}
    volumes:
      - ${BASE_PATH}/config:/config
      - ${DATA_PATH}:/data
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/qbittorrent.svg
