x-arcane:
  icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/nzbget.svg
  urls:
    - https://docs.linuxserver.io/images/docker-nzbget/

services:
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-6789}:6789"
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${BASE_PATH}/config:/config
      - ${DATA_PATH}:/data
    labels:
      com.getarcaneapp.arcane.icon: https://raw.githubusercontent.com/selfhst/icons/main/svg/nzbget.svg
