x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/searxng.svg
  urls:
    - https://docs.searxng.org/admin/installation-docker.html

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: ${BASE_URL:-http://localhost:8888/}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
    volumes:
      - searxng-config:/etc/searxng
      - searxng-data:/var/cache/searxng
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/searxng.svg

volumes:
  searxng-config:
  searxng-data:
