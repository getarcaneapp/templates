x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/bazarr.svg
  urls:
    - https://docs.linuxserver.io/images/docker-bazarr/

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-6767}:6767"
    environment:
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${BASE_PATH}/config:/config
      - ${DATA_PATH}:/data
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/bazarr.svg
