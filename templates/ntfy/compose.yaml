x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/ntfy.svg
  urls:
    - https://docs.ntfy.sh/install/#docker

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8090}:80"
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/ntfy.svg
    command: [serve]
    environment:
      NTFY_BASE_URL: ${BASE_URL:-http://localhost:8090}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - data:/var/lib/ntfy

volumes:
  data:
