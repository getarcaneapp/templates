x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/stirling-pdf.svg
  urls:
    - https://docs.stirlingpdf.com/

services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8085}:8080"
    environment:
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SECURITY_INITIALLOGIN_PASSWORD: ${ADMIN_PASSWORD}
      SYSTEM_DEFAULTLOCALE: en-US
    volumes:
      - stirling-config:/configs
      - stirling-data:/usr/share/tessdata
      - stirling-logs:/logs
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/stirling-pdf.svg

volumes:
  stirling-config:
  stirling-data:
  stirling-logs:
