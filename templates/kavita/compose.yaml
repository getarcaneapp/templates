x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/kavita.svg
  urls:
    - https://wiki.kavitareader.com/installation/docker/

services:
  kavita:
    image: jvmilazz0/kavita:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${BASE_PATH}/config:/kavita/config
      - ${BOOKS_PATH}:/books:ro
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/kavita.svg
