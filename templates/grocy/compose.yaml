x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/grocy.svg
  urls:
    - https://docs.linuxserver.io/images/docker-grocy/

services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-9283}:80"
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/grocy.svg
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - config:/config

volumes:
  config:
