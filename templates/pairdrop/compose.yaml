x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/pairdrop.svg
  urls:
    - https://github.com/schlagmichdoch/PairDrop/blob/master/docs/host-your-own.md

services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/pairdrop.svg
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      RATE_LIMIT: "true"
      WS_FALLBACK: ${WS_FALLBACK:-false}
