x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/homebox.svg
  urls:
    - https://github.com/sysadminsmedia/homebox/blob/main/docs/src/content/docs/en/quick-start/install.mdx

services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3100}:7745"
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/homebox.svg
    environment:
      TZ: ${TZ:-Etc/UTC}
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      HBOX_AUTH_API_KEY_PEPPER: ${API_KEY_PEPPER:?Set a random API key pepper of at least 32 characters}
    volumes:
      - data:/data

volumes:
  data:
