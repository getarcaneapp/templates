packages:
  - site

autoDedupe: true

update:
  githubActions: true

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.1
  ws: ">=8.22.2"
  undici: ">=8.12.4"
  typescript: ">=7.0.2"

overrides:
  "fast-uri": ">=3.1.5"
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
