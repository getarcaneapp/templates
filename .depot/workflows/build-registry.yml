name: Deploy Production Registry

on:
  push:
    branches:
      - main

permissions:
  actions: read
  deployments: write
  contents: write
  id-token: write

concurrency:
  group: "production-registry-deploy"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'arcane-github-automation[bot]' }}
    runs-on: depot-ubuntu-latest
    environment:
      name: production
      url: https://registry.getarcane.app
    steps:
      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: templates
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "arcane-github-automation[bot]"
          git config --global user.email "315613249+arcane-github-automation[bot]@users.noreply.github.com"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Validate templates
        run: vp run type-check && vp run generate && vp run validate

      - name: Generate registry.json
        env:
          REGISTRY_NAME: Arcane Community Templates
          REGISTRY_DESCRIPTION: Community Docker Compose Templates for Arcane
          REGISTRY_AUTHOR: getarcaneapp
          REGISTRY_URL: "https://github.com/getarcaneapp/templates"
          PUBLIC_BASE: "https://registry.getarcane.app/templates"
          DOCS_BASE: "https://github.com/getarcaneapp/templates/tree/main/templates"
          BUMP_PART: minor
          SCHEMA_URL: "https://registry.getarcane.app/schema.json"
        run: vp run generate

      - name: Commit registry.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: "."
          branch: ""
          commit_message: "chore: update registry.json [skip ci]"
          commit_user_name: arcane-github-automation[bot]
          commit_user_email: 315613249+arcane-github-automation[bot]@users.noreply.github.com
          commit_author: "arcane-github-automation[bot] <315613249+arcane-github-automation[bot]@users.noreply.github.com>"
          commit_options: ""
          file_pattern: "registry.json"
          add_options: ""
          tag_name: ""
          tagging_message: ""
          status_options: "--porcelain"
          push_options: ""
          skip_dirty_check: false
          skip_fetch: false
          skip_checkout: false
          skip_push: false
          disable_globbing: false
          create_branch: false
          create_git_tag_only: false

      - name: Stage build directory
        run: vp run stage

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp exec wrangler deploy
